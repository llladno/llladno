<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#171225"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
      <animate attributeName="x1" values="-20%;20%;-20%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;120%;80%" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, 'Segoe UI', sans-serif; font-weight: 700; }
      .subtitle { font-family: 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #9ca3af; }
      .cursor-char { fill: #34d399; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .node { fill: none; stroke: #4b5563; stroke-width: 1; opacity: 0.55; }
      .dot { fill: #818cf8; }
      .dot.alt { fill: #34d399; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .pulse2 { animation: pulse 3.6s ease-in-out infinite 0.6s; }
      .pulse3 { animation: pulse 4.2s ease-in-out infinite 1.2s; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <circle cx="180" cy="70" r="220" fill="url(#blobIndigo)">
    <animate attributeName="cx" values="180;260;180" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="260" r="240" fill="url(#blobEmerald)">
    <animate attributeName="cy" values="260;180;260" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- decorative node network, nod to AI/analytics -->
  <g transform="translate(880,40)">
    <line class="node" x1="0" y1="30" x2="70" y2="0"/>
    <line class="node" x1="70" y1="0" x2="150" y2="45"/>
    <line class="node" x1="0" y1="30" x2="60" y2="80"/>
    <line class="node" x1="60" y1="80" x2="150" y2="45"/>
    <line class="node" x1="60" y1="80" x2="120" y2="120"/>
    <circle class="dot pulse" cx="0" cy="30" r="4"/>
    <circle class="dot alt pulse2" cx="70" cy="0" r="4"/>
    <circle class="dot pulse3" cx="150" cy="45" r="4"/>
    <circle class="dot alt pulse" cx="60" cy="80" r="4"/>
    <circle class="dot pulse2" cx="120" cy="120" r="4"/>
  </g>

  <text x="70" y="150" class="title" font-size="56" fill="url(#titleGrad)">Grigory Mansurov</text>

  <rect x="72" y="168" width="360" height="3" fill="url(#underline)"/>

  <text x="70" y="215" class="subtitle" font-size="24">Frontend Developer — Vue / React · Nuxt + NestJS<tspan class="cursor-char"> |</tspan></text>

  <text x="70" y="255" class="subtitle" font-size="17" fill="#6b7280">4+ года в проде · строю Pockets Money — AI-финансовый помощник</text>
</svg>
